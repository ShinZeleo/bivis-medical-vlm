# ==============================================================================
# EVALUATION PROTOCOL CONFIGURATION
# Project: Medical VLM Reliability Under Language Shift (IndoRad-VQA)
# Frozen Protocol for Baseline (7B) and Candidate Screening (32B)
# ==============================================================================

project:
  name: "Medical VLM IndoRad-VQA Reliability"
  random_seed: 42
  device: "cuda"

dataset:
  name: "Lab-IS/IndoRad-VQA"
  hf_repo: "Lab-IS/IndoRad-VQA"
  frozen_manifest: "results/bilingual_pair_manifest.csv"
  total_raw_rows: 2244
  clean_image_level_rows: 1793
  frozen_sample_size: 150
  answer_type: "YES_NO"

models:
  baseline_7b:
    id: "Qwen/Qwen2.5-VL-7B-Instruct"
    quantization: "4bit-nf4"
    compute_dtype: "bfloat16"
  candidate_32b:
    id: "Qwen/Qwen2.5-VL-32B-Instruct"
    quantization: "4bit-nf4"
    compute_dtype: "bfloat16"
  candidate_screening_3b:
    id: "Qwen/Qwen2.5-VL-3B-Instruct"
    quantization: "4bit-nf4"
    compute_dtype: "bfloat16"
  candidate_screening_med_7b:
    id: "FreedomIntelligence/HuatuoGPT-Vision-7B-Qwen2.5VL"
    quantization: "4bit-nf4"
    compute_dtype: "bfloat16"

prompts:
  en:
    instruction: "Answer the radiology visual question based on the image. Provide only the answer."
    template: "Answer the radiology visual question based on the image. Provide only the answer.\nQuestion: {question}"
  id:
    instruction: "Jawab pertanyaan radiologi berdasarkan gambar. Berikan hanya jawabannya."
    template: "Jawab pertanyaan radiologi berdasarkan gambar. Berikan hanya jawabannya.\nPertanyaan: {question}"

inference:
  max_new_tokens: 4
  do_sample: false
  temperature: 0.0
  return_dict_in_generate: true
  output_scores: true
  vision:
    min_pixels: 200704    # 256 * 28 * 28
    max_pixels: 262144    # 512 * 512 (Kaggle/Colab OOM guard)

normalization:
  rules:
    - match: ["YES", "YA"]
      target: "YES"
    - match: ["NO", "TIDAK"]
      target: "NO"
    - fallback: "FIRST_10_CHARS_UPPERCASE"

confidence_method:
  type: "normalized_binary_posterior"
  token_sets:
    yes: ["YES", " YES", "Yes", " Yes"]
    no: ["NO", " NO", "No", " No"]
  threshold_unparseable: 0.50

metrics:
  tier_1_deterministic:
    - accuracy_en
    - accuracy_id
    - language_gap
    - flip_rate
    - joint_correctness
    - wilson_confidence_interval_95
  tier_2_exploratory:
    - expected_calibration_error_ece
    - brier_score
    - confidently_wrong_rate_90
    - visual_flip_rate_p0_p1
    - mean_delta_p
